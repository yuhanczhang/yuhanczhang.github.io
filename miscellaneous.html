<head>
  <meta charset="UTF-8" />

  <title>Miscellaneous | Yuhan Zhang</title>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f7f4ef;
      --surface: rgba(255, 255, 255, 0.78);
      --text: #1f1a17;
      --muted: #6c635d;
      --accent: #8a1f1f;
      --border: #ddd1c6;
      --shadow: 0 18px 42px rgba(60, 39, 24, 0.08);
      --sidebar-width: 348px;
      --container-width: 1320px;
      --gap: 72px;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: radial-gradient(circle at top left, rgba(203, 173, 141, 0.18), transparent 30%), linear-gradient(180deg, #fbfaf7 0%, var(--bg) 100%);
      color: var(--text);
      line-height: 1.72;
      font-size: 16px;
    }

    .container {
      max-width: var(--container-width);
      margin: 0 auto;
      padding: 56px 36px 72px;
      display: grid;
      grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
      gap: var(--gap);
      align-items: start;
    }

    .sidebar {
      position: sticky;
      top: 32px;
      padding: 28px 26px;
      border: 1px solid rgba(221, 209, 198, 0.9);
      background: var(--surface);
      backdrop-filter: blur(8px);
      box-shadow: var(--shadow);
    }

    .portrait-wrap { margin-bottom: 22px; display: flex; justify-content: center; }
    .sidebar img {
      width: 280px;
      height: 280px;
      border-radius: 50%;
      object-fit: cover;
      object-position: center top;
      border: 4px solid #f3ebe3;
      box-shadow: 0 10px 28px rgba(71, 49, 31, 0.14);
    }

    .sidebar h1 { font-family: 'EB Garamond', serif; font-size: 2.05rem; line-height: 1.05; margin-bottom: 10px; text-align: center; }
    .email, .affiliation { color: var(--muted); text-align: center; }
    .email { font-size: 0.9rem; margin-bottom: 10px; }
    .affiliation { font-size: 0.92rem; line-height: 1.62; margin-bottom: 16px; }
    .email a { color: inherit; text-decoration: none; }
    .affiliation a { color: var(--accent); text-decoration: none; }
    .affiliation a:hover { text-decoration: underline; }

    .icon-row { display: flex; justify-content: center; gap: 8px; margin-bottom: 22px; }
    .icon-link {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: #fffdfa;
      color: var(--text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
    }
    .icon-link:hover { color: var(--accent); border-color: #c9b09d; }
    .icon-link i { font-size: 20px; }

    nav { display: flex; flex-direction: column; gap: 8px; align-items: center; }
    nav a {
      width: 100%;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      color: var(--text);
      font-size: 0.95rem;
      text-align: center;
      text-decoration: none;
    }
    nav a:hover, nav a.active { color: var(--accent); }

    main { min-width: 0; padding-top: 4px; }
    h2 {
      font-family: 'EB Garamond', serif;
      font-size: 1.9rem;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .title-date { color: var(--muted); font-family: 'DM Sans', sans-serif; font-size: 0.9rem; font-weight: 400; white-space: nowrap; }
    .visitor-card {
      padding: 26px;
      border: 1px solid var(--border);
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    .counter-label { color: var(--muted); font-size: 0.82rem; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; }
    .counter { margin: 8px 0 22px; min-height: 32px; }
    .counter img { display: block; height: 28px; width: auto; }
    .map-frame {
      position: relative;
      min-height: 390px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 1px solid var(--border);
      background: #252526 url("https://widgets.amung.us/mapbacks/night.jpg") center / contain no-repeat;
    }
    .map-frame span { position: relative; z-index: 1; }
    .local-map-preview { display: none; position: absolute; inset: 0; z-index: 2; }
    .local-map-preview .visitor-dot {
      position: absolute;
      left: 16.1%;
      top: 29.2%;
      width: 14px;
      height: 14px;
      border: 3px solid #fff;
      border-radius: 50%;
      background: #e14d67;
      box-shadow: 0 0 0 4px rgba(225, 77, 103, 0.32);
      transform: translate(-50%, -50%);
    }
    .local-map-preview .visitor-dot::after {
      content: "Los Altos, US · local preview";
      position: absolute;
      left: 16px;
      top: -8px;
      width: max-content;
      padding: 4px 7px;
      border-radius: 3px;
      background: rgba(31, 26, 23, 0.88);
      color: #fff;
      font-size: 0.72rem;
      font-weight: 400;
    }
    body.is-local .local-map-preview { display: block; }
    body.is-local .map-widget { display: none; }
    body.is-local .map-frame {
      background-color: #eee9e2;
      background-image: url("https://upload.wikimedia.org/wikipedia/commons/thumb/5/51/BlankMap-Equirectangular.svg/960px-BlankMap-Equirectangular.svg.png");
    }
    .map-frame > div, .map-frame iframe { max-width: 100%; }
    .map-note { margin-top: 14px; color: var(--muted); font-size: 0.82rem; }

    @media (max-width: 980px) {
      .container { grid-template-columns: 1fr; gap: 30px; padding: 26px 20px 48px; }
      .sidebar { position: static; }
      .map-frame { min-height: 300px; }
    }
  </style>
</head>

  <script>
    (() => {
      if (location.hostname === "localhost" || location.hostname === "127.0.0.1") {
        document.body.classList.add("is-local");
      }
      const visitorKey = "yuhan-website-visitor-counted-v1";
      if (!localStorage.getItem(visitorKey)) {
        const counter = new Image();
        counter.onload = () => {
          localStorage.setItem(visitorKey, "true");
          document.getElementById("visitor-count").src += "&refresh=" + Date.now();
        };
        counter.src = "https://visitor-badge.one9x.com/badge?page_id=yuhanczhang.github.io&namespace=yuhanzhang&unique=true&timeframe=86400";
      }
    })();
